name: Grok Guardian - Weekly Report

on:
  schedule:
    - cron: '0 20 * * 0'   # Runs every Sunday at 20:00 UTC (12:00 PM Pacific)
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install yfinance
      
      - name: Run Weekly Report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python guardian.py weekly
